[workspace]
resolver = "3"
members = ["app", "core/folio-scanner"]

[workspace.dependencies]
# Pre-release: pin a rev of `dev` (never rewritten). Bump with:
#   git ls-remote https://github.com/anomalyco/rune dev
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
